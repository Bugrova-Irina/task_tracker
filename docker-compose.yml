services:
  db:
    image: postgres:15.1-alpine
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data/
    ports:
      - "${PORT}:5432"
    healthcheck:
      test: pg_isready -U ${USER} -d ${NAME}
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  backend:
    build: .
    command: >
      bash -c "
      echo 'Waiting for database...' &&
      sleep 10 &&
      python manage.py migrate &&
      python manage.py collectstatic -c --no-input &&
      python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8000"
    volumes:
      - django_static:/task_tracker/static/
    networks:
      - app-network

  web:
    image: nginx:1.19.3
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - django_static:/usr/share/nginx/html/static/
    networks:
      - app-network

volumes:
  pg_data:
  django_static:
  redis-data:

networks:
  app-network:
    driver: bridge
